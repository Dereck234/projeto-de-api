<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Cine Prisma</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
      <div class="container">
          <a href="/" class="logo">Cine Prisma</a>
          <nav id="nav-menu">
              <!-- O menu de usuário será carregado via user-status.js -->
          </nav>
      </div>
  </header>

  <main class="container auth-page">
    <div class="auth-form-container">
      <h2>Acessar sua Conta</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required>
        </div>
        <button type="submit" class="btn btn-primary">Entrar</button>
        <p id="error-message" class="error-message"></p>
      </form>
      <p>Não tem uma conta? <a href="/cadastro.html">Registre-se aqui</a>.</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2024 Cine Prisma. Todos os direitos reservados.</p>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/user-status.js"></script>
</body>
</html>
