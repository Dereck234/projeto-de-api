
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar - Cinema API</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-container">
      <h1><a href="/" style="color: inherit; text-decoration: none;">Cinema API</a></h1>
      <nav id="user-nav">
        <!-- Os botões de login/logout aparecerão aqui -->
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-form-container">
      <h2>Crie sua Conta</h2>
      <form id="register-form">
        <div class="form-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required>
        </div>
        <button type="submit" class="auth-button">Criar Conta</button>
        <p id="error-message" class="error-message"></p>
      </form>
      <p>Já tem uma conta? <a href="/login.html">Acesse aqui</a>.</p>
    </div>
  </main>

  <footer>
    <p>Cine API - Todos os direitos reservados</p>
  </footer>
  <script src="auth.js"></script>
  <script src="user-status.js"></script>
</body>
</html>
